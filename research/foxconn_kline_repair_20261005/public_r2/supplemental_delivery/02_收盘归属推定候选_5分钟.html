const MODE='5min',q=id=>document.getElementById(id),fmt=(v,n=2)=>v===null||v===undefined?'无成交记录':Number(v).toLocaleString('zh-CN',{minimumFractionDigits:n,maximumFractionDigits:n}),units=v=>Math.abs(v)>=1e8?fmt(v/1e8)+' 亿':Math.abs(v)>=1e4?fmt(v/1e4)+' 万':fmt(v,0);let DB,days,index,shown=[],hover=-1;
function choose(v){let i=days.indexOf(v);if(i<0){i=days.findIndex(d=>d>=v);if(i<0)i=days.length-1}index=Math.max(0,Math.min(days.length-1,i));q('date').value=days[index];render()}
function render(){let n=Number(q('span').value),chosen=days.slice(Math.max(0,index-n+1),index+1);shown=[];for(let d of chosen)for(let r of DB.days[d])shown.push({d,r});let rows=DB.days[days[index]],last=rows.at(-1),ohlc=MODE!=='intraday';let o=ohlc?rows[0][1]:rows[0][1],c=ohlc?last[4]:last[1],hi=Math.max(...rows.map(r=>ohlc?r[2]:r[1]).filter(Number.isFinite)),lo=Math.min(...rows.map(r=>ohlc?r[3]:r[1]).filter(Number.isFinite)),vol=rows.reduce((s,r)=>s+(ohlc?r[5]:r[2]),0);q('stats').innerHTML=[['所选日首价',fmt(o)],['末价',fmt(c)],['最高',fmt(hi)],['最低',fmt(lo)],['成交量',units(vol)]].map(([a,b])=>'<div class="stat"><small>'+a+'</small><b>'+b+'</b></div>').join('');q('status').textContent=(index+1)+' / '+days.length+' 日';q('prev').disabled=index===0;q('next').disabled=index===days.length-1;let warnings=chosen.filter(d=>DB.quality[d]);q('notice').textContent=warnings.length?'所选范围含 '+warnings.length+' 个存在来源价格对照差异的交易日；保留原值，请结合逐日质量表使用。':'逐笔源重建候选；请查看daily_transaction_quality.csv。日线核对通过不等于上游逐笔完整性已获独立认证。';q('caption').textContent=MODE==='intraday'?'分时价格（蓝） / 供应商累计均价（金）；下方为分钟成交量。时间以分钟结束标签展示。':'红涨绿跌；无成交记录分钟留空，下方为成交量。开盘竞价另存opening_auction.csv；15:00收盘竞价归入末根。';hover=-1;draw()}
function draw(){const el=q('chart'),box=el.getBoundingClientRect(),W=box.width,H=box.height,dpr=window.devicePixelRatio||1;el.width=W*dpr;el.height=H*dpr;let ctx=el.getContext('2d');ctx.scale(dpr,dpr);const L=66,R=W-24,T=30,B=H-125,VB=H-40,VT=B+34;ctx.clearRect(0,0,W,H);let candle=MODE!=='intraday',values=shown.flatMap(({r})=>candle?[r[2],r[3]]:[r[1],r[3]]).filter(Number.isFinite),mn=Math.min(...values),mx=Math.max(...values),pad=(mx-mn)*.08||.2;mn-=pad;mx+=pad;const y=v=>T+(mx-v)/(mx-mn)*(B-T),step=(R-L)/shown.length,x=i=>L+(i+.5)*step;ctx.font='11px system-ui';for(let k=0;k<=4;k++){let v=mn+(mx-mn)*k/4,Y=y(v);ctx.strokeStyle='#304250';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(L,Y);ctx.lineTo(R,Y);ctx.stroke();ctx.fillStyle='#91a6b7';ctx.fillText(fmt(v),8,Y+4)}let vmax=Math.max(...shown.map(({r})=>candle?r[5]:r[2]))||1;
for(let i=0;i<shown.length;i++){let r=shown[i].r,c=candle?(r[4]>=r[1]?'#f16e70':'#46c6a1'):'#557f9f';ctx.fillStyle=c;ctx.strokeStyle=c;ctx.lineWidth=1;let X=x(i),bw=Math.max(.6,Math.min(8,step*.7));if(candle&&Number.isFinite(r[1])){ctx.beginPath();ctx.moveTo(X,y(r[2]));ctx.lineTo(X,y(r[3]));ctx.stroke();ctx.fillRect(X-bw/2,Math.min(y(r[1]),y(r[4])),bw,Math.max(1,Math.abs(y(r[1])-y(r[4]))))}let v=candle?r[5]:r[2];ctx.fillRect(X-bw/2,VB-(v/vmax)*(VB-VT),bw,(v/vmax)*(VB-VT));if(i&&shown[i].d!==shown[i-1].d){ctx.strokeStyle='#455766';ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(X-step/2,T);ctx.lineTo(X-step/2,VB);ctx.stroke();ctx.setLineDash([])}}
if(!candle)for(let [col,color] of [[1,'#70b8f0'],[3,'#e3b872']]){ctx.strokeStyle=color;ctx.lineWidth=1.35;ctx.beginPath();shown.forEach(({r,d},i)=>{if(i===0||d!==shown[i-1].d)ctx.moveTo(x(i),y(r[col]));else ctx.lineTo(x(i),y(r[col]))});ctx.stroke()}
const marks=[0,Math.floor((shown.length-1)*.25),Math.floor((shown.length-1)*.5),Math.floor((shown.length-1)*.75),shown.length-1];ctx.fillStyle='#91a6b7';ctx.textAlign='center';for(let i of marks){let a=shown[i];ctx.fillText(q('span').value==='1'?a.r[0]:a.d.slice(5)+' '+a.r[0],Math.max(L+20,Math.min(R-20,x(i))),H-17)}ctx.textAlign='left';ctx.fillText('成交量',8,VT+8);ctx.fillText(units(vmax),8,VT+23);
if(hover>=0&&hover<shown.length){let X=x(hover);ctx.strokeStyle='#e7eef4';ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(X,T);ctx.lineTo(X,VB);ctx.stroke();ctx.setLineDash([])}el.onpointermove=e=>{hover=Math.max(0,Math.min(shown.length-1,Math.floor((e.clientX-box.left-L)/step)));let {d,r}=shown[hover];q('tooltip').style.display='block';q('tooltip').innerHTML='<b>'+d+' '+r[0]+'</b><br>'+(candle?'开 '+fmt(r[1])+'　高 '+fmt(r[2])+'<br>低 '+fmt(r[3])+'　收 '+fmt(r[4])+'<br>量 '+units(r[5])+' 股<br>额 '+units(r[6])+' 元':'价格 '+fmt(r[1])+'　均价 '+fmt(r[3],4)+'<br>量 '+units(r[2])+' 股');requestAnimationFrame(draw)};el.onpointerleave=()=>{hover=-1;q('tooltip').style.display='none';requestAnimationFrame(draw)}}
q('prev').onclick=()=>choose(days[Math.max(0,index-1)]);q('next').onclick=()=>choose(days[Math.min(days.length-1,index+1)]);q('date').onchange=e=>choose(e.target.value);q('span').onchange=render;window.onresize=()=>DB&&draw();window.onkeydown=e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowLeft')q('prev').click();if(e.key==='ArrowRight')q('next').click()};q('csv').onclick=()=>{let cols=MODE==='intraday'?['datetime','price','volume_shares','provider_avg_price']:['datetime','open','high','low','close','volume_shares','amount_cny'];let csv='\ufeff'+cols.join(',')+'\n'+shown.map(({d,r})=>[d+' '+r[0]+':00',...r.slice(1)].join(',')).join('\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='601138_'+MODE+'_'+days[index]+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
(async()=>{try{let raw=Uint8Array.from(atob(q('packed').textContent.trim()),c=>c.charCodeAt(0));let stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));DB=JSON.parse(await new Response(stream).text());days=Object.keys(DB.days).sort();q('range').textContent=days[0]+' — '+days.at(-1)+' · '+days.length.toLocaleString()+' 个交易日 · '+DB.rows.toLocaleString()+' 条记录';q('date').min=days[0];q('date').max=days.at(-1);choose(days.at(-1));window.__chartReady=true}catch(e){q('range').textContent='载入失败：'+e.message+'。请用较新版 Chrome / Edge / Safari 打开。';window.__chartError=e.message}})();
</script></html>
