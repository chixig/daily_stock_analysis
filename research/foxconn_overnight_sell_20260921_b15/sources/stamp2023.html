<p style="text-align: center;"><b>财政部 税务总局公告2023年第39号</b><o:p style="font-size: 12pt;"></o:p>&nbsp;</p>
<p align="justify">　　为活跃资本市场、提振投资者信心，自2023年8月28日起，证券交易印花税实施减半征收。<o:p></o:p>&nbsp;</p>
<p align="justify">　　特此公告。<o:p></o:p>&nbsp;</p>
<p align="justify" style="text-align: right;">财政部&nbsp; 税务总局&nbsp;</p>
