name: Foxconn independent historical source acquisition
on:
  push:
    branches: [research/foxconn-kline-20261005]
    paths:
      - scripts/research/foxconn_kline_independent_sources.py
      - scripts/research/foxconn_kline_public_quotes.py
      - scripts/research/foxconn_kline_qlib_probe.py
      - .github/workflows/foxconn-kline-independent.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: foxconn-kline-20261005
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==2.1.3 pyarrow==19.0.1 requests==2.32.3 playwright==1.55.0 remotezip==0.12.3 fsspec==2025.3.2 aiohttp==3.11.18
      - name: Acquire complete recent transaction coverage in checkpointed batches
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for batch in 1 2 3 4 5 6; do
            python -u scripts/research/foxconn_kline_independent_sources.py
            git add -f research/foxconn_kline_repair_20261005/
            if ! git diff --cached --quiet; then
              git commit -m "Preserve stock-specific transaction evidence batch ${batch}"
              git push origin HEAD:research/foxconn-kline-20261005
            fi
          done
      - uses: actions/download-artifact@v4
        with:
          name: foxconn-qlib-source-scout
          run-id: 37230852634
          github-token: ${{ github.token }}
          path: research/foxconn_kline_repair_20261005/
      - run: python -u scripts/research/foxconn_kline_serving_probe.py
      - run: python -u scripts/research/foxconn_kline_trade_metadata.py
      - run: python -u scripts/research/foxconn_kline_trade_build.py
      - run: python -u scripts/research/foxconn_kline_trade_verify.py
      - run: python -m playwright install --with-deps chromium
      - run: python -u scripts/research/foxconn_kline_trade_chart_verify.py
      - run: python -u scripts/research/foxconn_kline_trade_package.py
      - name: Preserve actual source evidence and access outcomes
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f research/foxconn_kline_repair_20261005/
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve independently acquired historical source evidence'
            git push origin HEAD:research/foxconn-kline-20261005
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foxconn-transaction-reconstruction
          path: research/foxconn_kline_repair_20261005/delivery/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foxconn-transaction-chart-qa
          path: /tmp/foxconn_trade_chart_qa/
          retention-days: 30
