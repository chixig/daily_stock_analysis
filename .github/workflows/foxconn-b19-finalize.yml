name: Foxconn B19 independent verification
on:
  push:
    branches: [research/foxconn-t0-20260928-b19]
    paths: [scripts/research/foxconn_b19_finalize.py, .github/workflows/foxconn-b19-finalize.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==2.1.3 tabulate==0.9.0 requests==2.32.3
      - name: Independently reconcile accounts and prepare review
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 524c7cd31f8fc8200288bd85596c1c6806ec6f9d
          python -m py_compile scripts/research/foxconn_b19_finalize.py
          python -u scripts/research/foxconn_b19_finalize.py 2>&1 | tee research/foxconn_t0_20260928_b19/finalize.log
      - name: Preserve verification
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f research/foxconn_t0_20260928_b19/
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve independently verified B19 research results'
            git push origin HEAD:research/foxconn-t0-20260928-b19
          fi
