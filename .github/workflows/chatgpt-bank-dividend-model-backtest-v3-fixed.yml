        uses: actions/upload-artifact@v4
        with:
          name: bank-dividend-model-backtest-${{ github.run_id }}
          path: |
            ${{ env.OUT_DIR }}/out/
            ${{ env.OUT_DIR }}/reports/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
