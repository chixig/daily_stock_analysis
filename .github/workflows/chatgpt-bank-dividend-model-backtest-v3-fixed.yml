              "- CET1",
              "- NIM",
              "- NIM trend",
              "",
              "### Valuation",
              "- PB",
              "- TTM dividend yield",
              "",
              "### Dividend",
              "- continuous dividend years",
              "- DPS CAGR",
              "- DPS max cut",
              "",
              "### 主模型",
              "",
              "`BankCore = 50% Quality + 30% Valuation + 20% Dividend`",
              "",
              "另测试：",
              "- BankQV",
              "- HighQualityLowValue",
              "- Quality-only",
              "- Value-only",
              "",
              "## 招商银行专项",
              "",
              f"- Eligible years: {cmb.get('years_eligible')}",
              f"- BankCore Top1 years: {cmb.get('BankCore_top1_years')}",
              f"- BankCore Top3 years: {cmb.get('BankCore_top3_years')}",
              f"- BankCore Top5 years: {cmb.get('BankCore_top5_years')}",
