      - name: Show files
        shell: bash
        run: |
          find \
            "${OUT_DIR}/out" \
            "${OUT_DIR}/reports" \
            -type f \
            -printf "%12s  %p\n" \
            | sort -n

          du -sh \
            "${OUT_DIR}/out" \
            "${OUT_DIR}/reports"

