name: ChatGPT Dividend PIT Top10 V2 Industry Routed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/research/dividend_pit_top10_v2.py"
      - ".github/workflows/chatgpt-dividend-pit-top10-v2.yml"

permissions:
  contents: read

env:
  OUT_DIR: _dividend_pit_top10_v2
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  backtest:
    name: PIT V2 industry-routed Top10 backtest
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pandas>=2.2" \
            "numpy>=1.26" \
            "pyarrow>=17" \
            "huggingface_hub>=0.25" \
            "hf_xet>=1.1" \
            "requests>=2.32" \
            "urllib3>=2.2" \
            "baostock>=0.8.9" \
            "tabulate>=0.9"

      - name: Run V2 industry-routed PIT backtest
        shell: bash
        run: |
          rm -rf "${OUT_DIR}"
          python scripts/research/dividend_pit_top10_v2.py

      - name: Show headline results
        if: always()
        shell: bash
        run: |
          if [ -f "${OUT_DIR}/out/README.md" ]; then
            sed -n '1,280p' "${OUT_DIR}/out/README.md"
          fi
          if [ -f "${OUT_DIR}/reports/baostock_early_failures.json" ]; then
            echo "===== BaoStock early failures ====="
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path("_dividend_pit_top10_v2/reports/baostock_early_failures.json")
          x = json.loads(p.read_text(encoding="utf-8"))
          print("failure_count=", len(x))
          print(json.dumps(x[:20], ensure_ascii=False, indent=2))
          PY
          fi

      - name: Upload V2 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dividend-pit-top10-v2-${{ github.run_id }}
          path: |
            ${{ env.OUT_DIR }}/out/
            ${{ env.OUT_DIR }}/reports/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1
