name: Foxconn B18 Bounded Strategy Search
on:
  push:
    branches: [research/foxconn-t0-20260926-b18]
    paths:
      - scripts/research/foxconn_b18.py
      - .github/workflows/foxconn-b18.yml
permissions:
  contents: write
concurrency:
  group: foxconn-b18
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas==2.2.3 numpy==2.1.3 tabulate==0.9.0 requests==2.32.3
      - run: python -m py_compile scripts/research/foxconn_b18.py
      - shell: bash
        run: |
          set -o pipefail
          python scripts/research/foxconn_b18.py 2>&1 | tee research/foxconn_t0_20260926_b18/calculation.log
      - name: Preserve B18 evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/foxconn_t0_20260926_b18/
          git diff --cached --quiet || git commit -m "research(B18): preserve bounded search evidence"
          git push origin HEAD:research/foxconn-t0-20260926-b18
