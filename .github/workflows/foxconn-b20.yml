name: Foxconn B20 combination research
on:
  push:
    branches: [research/foxconn-t0-20261002-b20]
    paths: [scripts/research/foxconn_b20.py, scripts/research/foxconn_b20_verify.py, .github/workflows/foxconn-b20.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: foxconn-b20
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==2.1.3 tabulate==0.9.0 requests==2.32.3
      - name: Freeze evidence before calculations
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 6c82922dadaaf605766d56f31ae1d5715a321a8d
          python -m py_compile scripts/research/foxconn_b20.py scripts/research/foxconn_b20_verify.py
          python scripts/research/foxconn_b20.py freeze
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f research/foxconn_t0_20261002_b20/frozen_input_hashes.json
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze B20 inputs before account calculations'
            git push origin HEAD:research/foxconn-t0-20261002-b20
          fi
      - name: Compute all fixed combinations
        run: |
          set -euo pipefail
          python -u scripts/research/foxconn_b20.py run 2>&1 | tee research/foxconn_t0_20261002_b20/calculation.log
      - name: Independently verify every saved account
        run: |
          set -euo pipefail
          python -u scripts/research/foxconn_b20_verify.py 2>&1 | tee research/foxconn_t0_20261002_b20/verification.log
      - name: Preserve research evidence
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f research/foxconn_t0_20261002_b20/
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve B20 research and verification evidence'
            git push origin HEAD:research/foxconn-t0-20261002-b20
          fi
