name: Foxconn B23 evidence and delivery
on:
  push:
    branches: [research/foxconn-t0-20261002-b23]
    paths:
      - scripts/research/foxconn_b23_delivery.py
      - .github/workflows/foxconn-b23-delivery.yml
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [details, delivery]
        default: details
        required: true
permissions:
  contents: write
concurrency:
  group: foxconn-b23-delivery
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==2.1.3 tabulate==0.9.0 requests==2.32.3
      - run: python scripts/research/foxconn_b23_delivery.py '${{ inputs.phase || 'details' }}'
      - name: Preserve verified delivery evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/foxconn_t0_20261002_b23
          git diff --cached --quiet || git commit -m 'Preserve B23 verified delivery evidence'
          git push
