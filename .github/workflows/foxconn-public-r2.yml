name: Foxconn additional public archive validation
on:
  push:
    branches: [research/foxconn-kline-20261005]
    paths: [scripts/research/foxconn_kline_public_r2_evaluate.py, scripts/research/foxconn_kline_public_r2.py, .github/workflows/foxconn-public-r2.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: foxconn-kline-20261005
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==2.1.3 pyarrow==19.0.1 requests==2.32.3 fsspec==2025.3.2 aiohttp==3.11.16
      - run: python -u scripts/research/foxconn_kline_public_r2_evaluate.py
      - run: python -u scripts/research/foxconn_kline_public_r2.py
      - run: python -u scripts/research/foxconn_kline_public_r2_evaluate.py
      - name: Preserve source evidence
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f research/foxconn_kline_repair_20261005/public_r2/
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve additional public archive probes for 601138'
            git push origin HEAD:research/foxconn-kline-20261005
          fi
