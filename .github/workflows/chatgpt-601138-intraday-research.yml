name: ChatGPT 601138 Intraday Research

on:
  workflow_dispatch:
    inputs:
      end_date:
        description: "Research end date YYYY-MM-DD"
        required: false
        default: "2026-09-10"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install baostock pandas numpy

      - name: Run 601138 5-minute research
        run: |
          python scripts/chatgpt_601138_intraday_research.py \
            --start 2021-01-01 \
            --research-start 2021-07-01 \
            --end "${{ inputs.end_date || '2026-09-10' }}" \
            --out research/601138_intraday

      - name: Show report
        if: always()
        run: |
          if [ -f research/601138_intraday/REPORT.md ]; then
            cat research/601138_intraday/REPORT.md
          fi

      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: industrial-fulian-601138-intraday-research
          path: |
            research/601138_intraday/**
          if-no-files-found: warn
          retention-days: 30

      - name: Commit research outputs
        if: success()
        run: |
          git config user.name "chatgpt-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/601138_intraday
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "research: add 601138 intraday 5m backtest"
            git push
          fi
