name: Foxconn B26 verified delivery
on:
  push:
    branches: [research/foxconn-t0-20261003-b26]
    paths: [scripts/research/foxconn_b26_delivery.py, .github/workflows/foxconn-b26-delivery.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: foxconn-b26
  cancel-in-progress: false
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==2.1.3 tabulate==0.9.0 requests==2.32.3 scikit-learn==1.6.1
      - name: Verify sealed accounts and prepare bounded delivery
        run: |
          set -euo pipefail
          python -m py_compile scripts/research/foxconn_b26_delivery.py
          python -u scripts/research/foxconn_b26_delivery.py 2>&1 | tee research/foxconn_t0_20261003_b26/delivery.log
      - name: Preserve delivery and failures
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f research/foxconn_t0_20261003_b26/
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve B26 verified delivery and evidence'
            git push origin HEAD:research/foxconn-t0-20261003-b26
          fi
