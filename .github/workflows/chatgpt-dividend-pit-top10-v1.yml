name: ChatGPT Dividend PIT Top10 V1

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OUT_DIR: _dividend_pit_top10_v1
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  backtest:
    name: PIT dynamic Top10 backtest
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pandas>=2.2" \
            "numpy>=1.26" \
            "pyarrow>=17" \
            "huggingface_hub>=0.25" \
            "hf_xet>=1.1" \
            "tabulate>=0.9"

      - name: Run PIT dynamic Top10 backtest
        shell: bash
        run: |
          rm -rf "${OUT_DIR}"
          python scripts/research/dividend_pit_top10_v1.py

      - name: Show headline results
        if: always()
        shell: bash
        run: |
          if [ -f "${OUT_DIR}/out/README.md" ]; then
            sed -n '1,220p' "${OUT_DIR}/out/README.md"
          fi

      - name: Upload backtest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dividend-pit-top10-v1-${{ github.run_id }}
          path: |
            ${{ env.OUT_DIR }}/out/
            ${{ env.OUT_DIR }}/reports/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1
