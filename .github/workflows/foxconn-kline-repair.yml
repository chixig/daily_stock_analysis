name: Foxconn minute source forensic audit
on:
  push:
    branches: [research/foxconn-kline-20261005]
    paths:
      - scripts/research/foxconn_kline_repair_audit.py
      - .github/workflows/foxconn-kline-repair.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: foxconn-kline-20261005
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==2.1.3 pyarrow==19.0.1 pytdxdata==0.6.1
      - run: python -u scripts/research/foxconn_kline_repair_audit.py
      - name: Preserve evidence on the authorized research branch
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f research/foxconn_kline_repair_20261005/
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve minute source forensic evidence'
            git push origin HEAD:research/foxconn-kline-20261005
          fi
