name: ChatGPT 601138 Intraday Research V2.1

on:
  workflow_dispatch:
    inputs:
      end_date:
        description: "Research end date YYYY-MM-DD"
        required: false
        default: "2026-09-10"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install baostock pandas numpy

      - name: Run V2.1
        run: |
          python scripts/chatgpt_601138_intraday_research_v2_1.py \
            --start 2021-01-01 \
            --research-start 2021-07-01 \
            --end "${{ inputs.end_date || '2026-09-10' }}" \
            --out research/601138_intraday_v2_1 \
            --reuse-minute-dir research/601138_intraday/minute_raw

      - name: Print report
        if: always()
        run: |
          test -f research/601138_intraday_v2_1/REPORT.md && cat research/601138_intraday_v2_1/REPORT.md || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: industrial-fulian-601138-intraday-v2-1
          path: research/601138_intraday_v2_1/**
          retention-days: 30

      - name: Commit outputs
        if: success()
        run: |
          git config user.name "chatgpt-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/601138_intraday_v2_1
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "research: 601138 intraday V2.1"
            git push
          fi
