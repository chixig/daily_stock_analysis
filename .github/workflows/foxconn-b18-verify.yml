name: Foxconn B18 Independent Verification
on:
  push:
    branches: [research/foxconn-t0-20260926-b18]
    paths:
      - scripts/research/foxconn_b18_verify.py
      - .github/workflows/foxconn-b18-verify.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas==2.2.3 numpy==2.1.3 tabulate==0.9.0 requests==2.32.3
      - run: python -m py_compile scripts/research/foxconn_b18_verify.py
      - run: python scripts/research/foxconn_b18_verify.py
      - name: Preserve independent checks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/foxconn_t0_20260926_b18/final_validation.json research/foxconn_t0_20260926_b18/independent_account_checks.csv research/foxconn_t0_20260926_b18/fine_execution_summary.csv research/foxconn_t0_20260926_b18/verification_manifest.json
          git diff --cached --quiet || git commit -m "research(B18): preserve independent checks"
          git push origin HEAD:research/foxconn-t0-20260926-b18
