name: ChatGPT Dividend PIT Top10 V2.2.1 Suspension Ledger Fix

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dividend-pit-top10-v2-1
  cancel-in-progress: false

env:
  OUT_DIR: _dividend_pit_top10_v2_2_1
  V22_ARTIFACT_DIR: _v22_frozen
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  replay:
    name: V2.2.1 frozen targets and suspension-aware accounting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # This single YAML includes the new engine. No separate PY upload is needed.
      - name: Materialize and verify embedded V2.2.1 engine
        shell: bash
        run: |
          python - <<'PYCODE'
          import base64, zlib, hashlib
          from pathlib import Path
          payload = ""
          data = zlib.decompress(base64.b64decode(payload))
          expected = "41b90258574f73625dac824e31bcdc95d1e8d014e06606d62e5ba79a3163e25b"
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit("Embedded engine checksum mismatch")
          dest = Path("scripts/research/dividend_pit_top10_v2_2_1.py")
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_bytes(data)
          compile(data, str(dest), "exec")
          print("V221_EMBEDDED_ENGINE_VERIFIED", expected)
          PYCODE

      - name: Install dependencies and record environment
        shell: bash
        run: |
          python -m pip install "pandas>=2.2,<4" "numpy>=1.26,<3" "tabulate>=0.9"
          mkdir -p "${OUT_DIR}/out" "${OUT_DIR}/reports"
          python -m pip freeze > "${OUT_DIR}/reports/environment.txt"

      - name: Run suspension, cash and accounting unit tests
        shell: bash
        run: |
          python scripts/research/dividend_pit_top10_v2_2_1.py --self-test 2>&1 | tee "${OUT_DIR}/reports/unit_tests.txt"

      - name: Restore frozen V2.2 artifact with original targets and checkpoint backup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${V22_ARTIFACT_DIR}"
          BACKUP="reference_inputs/v22_failed/dividend-pit-top10-v2-2-34926927234-1.zip"
          if [ -f "$BACKUP" ]; then
            cp "$BACKUP" _v22_frozen.zip
          else
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10380188889/zip" \
              -o _v22_frozen.zip
          fi
          echo "1b4c808d7cf454f0c0197218a0b59fae8aa2d7e17bcd28e562729e5ea927b483  _v22_frozen.zip" | sha256sum -c -
          python - <<'PYCODE'
          import os, zipfile
          from pathlib import Path
          dest = Path(os.environ["V22_ARTIFACT_DIR"]).resolve()
          with zipfile.ZipFile("_v22_frozen.zip") as z:
              for info in z.infolist():
                  path = (dest/info.filename).resolve()
                  if not path.is_relative_to(dest):
                      raise SystemExit("Unsafe artifact member")
              z.extractall(dest)
          print("FROZEN_ARTIFACT_EXTRACTED", dest)
          PYCODE
          python scripts/research/dividend_pit_top10_v2_2_1.py --check-frozen 2>&1 | tee "${OUT_DIR}/reports/frozen_input_check.txt"

      # NO BaoStock login, NO financial refetch, NO rescore, NO parameter tuning.
      # The exact same Qlib market archive is downloaded and SHA256-verified.
      - name: Replay all 14 periods with carried holdings and deferred execution
        timeout-minutes: 20
        shell: bash
        run: |
          python scripts/research/dividend_pit_top10_v2_2_1.py 2>&1 | tee "${OUT_DIR}/reports/run.log"

      - name: Show accounting results and research acceptance status
        if: always()
        shell: bash
        run: |
          for name in engineering_gates.json fatal_error.json; do
            if [ -f "${OUT_DIR}/reports/${name}" ]; then cat "${OUT_DIR}/reports/${name}"; fi
          done
          if [ -f "${OUT_DIR}/reports/return_reconciliation.csv" ]; then cat "${OUT_DIR}/reports/return_reconciliation.csv"; fi
          if [ -f "${OUT_DIR}/out/README.md" ]; then cat "${OUT_DIR}/out/README.md"; fi

      - name: Upload results, execution audit and frozen-input backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dividend-pit-top10-v2-2-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OUT_DIR }}/out/
            ${{ env.OUT_DIR }}/reports/
            ${{ env.V22_ARTIFACT_DIR }}/
            scripts/research/dividend_pit_top10_v2_2_1.py
          if-no-files-found: warn
          retention-days: 30
          compression-level: 1
