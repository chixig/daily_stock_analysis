name: Foxconn B22 entry filter research
on:
  push:
    branches: [research/foxconn-t0-20261002-b22]
    paths: [scripts/research/foxconn_b22.py, scripts/research/foxconn_b22_verify.py, .github/workflows/foxconn-b22.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: foxconn-b22
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==2.1.3 tabulate==0.9.0 requests==2.32.3
      - name: Freeze registry and inputs before calculation
        run: |
          set -euo pipefail
          git fetch --depth=1 origin e64b733ad39e828c32034dce6d4f2cf7a8ae7b2a
          python -m py_compile scripts/research/foxconn_b22.py scripts/research/foxconn_b22_verify.py
          python scripts/research/foxconn_b22.py freeze
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f research/foxconn_t0_20261002_b22/frozen_input_hashes.json research/foxconn_t0_20261002_b22/registry.json research/foxconn_t0_20261002_b22/registry.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze B22 registry and inputs before market computation'
            git push origin HEAD:research/foxconn-t0-20261002-b22
          fi
      - name: Compute 168 complete accounts
        run: |
          set -euo pipefail
          python -u scripts/research/foxconn_b22.py run 2>&1 | tee research/foxconn_t0_20261002_b22/calculation.log
      - name: Independently verify saved accounts and decisions
        run: |
          set -euo pipefail
          python -u scripts/research/foxconn_b22_verify.py 2>&1 | tee research/foxconn_t0_20261002_b22/verification.log
      - name: Preserve results and failures
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f research/foxconn_t0_20261002_b22/
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve B22 filter research and verification evidence'
            git push origin HEAD:research/foxconn-t0-20261002-b22
          fi
