name: Foxconn B27 shared portfolio research
on:
  push:
    branches: [research/foxconn-t0-20261003-b27]
    paths: [scripts/research/foxconn_b27.py, scripts/research/foxconn_b27_verify.py, .github/workflows/foxconn-b27.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: foxconn-b27
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==2.1.3 tabulate==0.9.0 requests==2.32.3 scikit-learn==1.6.1
      - name: Freeze protocol registry and inherited bytes before computation
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 7160be728e0a0848b5e12899f056def1c0de0eba
          python -m py_compile scripts/research/foxconn_b27.py scripts/research/foxconn_b27_verify.py
          python scripts/research/foxconn_b27.py freeze
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f research/foxconn_t0_20261003_b27/
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze B27 complete registry and source hashes before computation'
            git push origin HEAD:research/foxconn-t0-20261003-b27
          fi
      - name: Compute shared broker accounts
        run: |
          set -euo pipefail
          python -u scripts/research/foxconn_b27.py run 2>&1 | tee research/foxconn_t0_20261003_b27/calculation.log
      - name: Independently replay every broker and logical ledger
        run: |
          set -euo pipefail
          python -u scripts/research/foxconn_b27_verify.py 2>&1 | tee research/foxconn_t0_20261003_b27/verification.log
      - name: Preserve results and failures on research branch
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f research/foxconn_t0_20261003_b27/
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve B27 portfolio results and validation evidence'
            git push origin HEAD:research/foxconn-t0-20261003-b27
          fi
