name: Foxconn public sources final audit
on:
  push:
    branches: [research/foxconn-kline-20261005]
    paths: [scripts/research/foxconn_kline_public_final_audit.py, .github/workflows/foxconn-public-final.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==2.1.3 pyarrow==19.0.1
      - run: python -u scripts/research/foxconn_kline_public_final_audit.py
      - name: Preserve audit and supplementary delivery
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f research/foxconn_kline_repair_20261005/public_r2/
          if ! git diff --cached --quiet; then
            git commit -m 'Audit native 2022 OHLC and distinguish 2026 trading sessions'
            git push origin HEAD:research/foxconn-kline-20261005
          fi
