name: Foxconn B17 Fixed Quantity
on:
  push:
    branches: [research/foxconn-t0-20260923-b17]
    paths:
      - scripts/research/foxconn_b17.py
      - .github/workflows/foxconn-b17.yml
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas==2.2.3 numpy==2.1.3 tabulate==0.9.0 requests==2.32.3
      - run: python -m py_compile scripts/research/foxconn_b17.py
      - shell: bash
        run: |
          set -o pipefail
          python scripts/research/foxconn_b17.py 2>&1 | tee research/foxconn_t0_20260923_b17/calculation.log
      - name: Preserve B17 evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/foxconn_t0_20260923_b17/
          git diff --cached --quiet || git commit -m "research(B17): preserve fixed quantity evidence"
          git push origin HEAD:research/foxconn-t0-20260923-b17
