name: ChatGPT Dividend PIT Top10 V2.2 Field Route Ledger Fix

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dividend-pit-top10-v2-1
  cancel-in-progress: false

env:
  OUT_DIR: _dividend_pit_top10_v2_2
  PIT_CACHE_DIR: _persistent_cache/baostock_early_v2_1
  BASELINE_ARTIFACT_DIR: _v211_frozen_baseline
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DOWNLOAD_TIMEOUT: "60"

jobs:
  backtest:
    name: V2.2 semantic fixes and reconciled accounting
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The complete new program is embedded below. Uploading this YAML alone is sufficient.
      # This writes ONLY the new V2.2 entry point in the disposable runner workspace.
      - name: Materialize and verify embedded V2.2 program
        shell: bash
        run: |
          python - <<'PYCODE'
          import base64, hashlib, zlib
          from pathlib import Path
          payload = ""
          source = zlib.decompress(base64.b64decode(payload))
          expected = "0ed9c3cde03ffc9a57d93b7f7d7c6aeb94eb486bcbbe6bb677596daea28cba0b"
          assert hashlib.sha256(source).hexdigest() == expected, "V2.2 source checksum mismatch"
          compile(source, "dividend_pit_top10_v2_2.py", "exec")
          path = Path("scripts/research/dividend_pit_top10_v2_2.py")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(source)
          print("EMBEDDED_V2_2_SOURCE_OK", expected)
          PYCODE

      - name: Install dependencies and record environment
        shell: bash
        run: |
          python -m pip install             "pandas>=2.2,<4" "numpy>=1.26,<3" "pyarrow>=17"             "huggingface_hub>=0.25" "hf_xet>=1.1"             "requests>=2.32" "urllib3>=2.2" "baostock>=0.8.9" "tabulate>=0.9"
          mkdir -p "${OUT_DIR}/out" "${OUT_DIR}/reports"
          python -m pip freeze > "${OUT_DIR}/reports/environment.txt"

      - name: Run offline accounting tests and real baseline import preflight
        shell: bash
        run: |
          python scripts/research/dividend_pit_top10_v2_2.py --self-test 2>&1 | tee "${OUT_DIR}/reports/preflight_tests.txt"
          python scripts/research/dividend_pit_top10_v2_2.py --preflight-base 2>&1 | tee "${OUT_DIR}/reports/baseline_preflight.txt"

      - name: Restore complete V2.1 checkpoint
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PIT_CACHE_DIR }}
          key: baostock-pit-v2-1-${{ runner.os }}-schema1-v22-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            baostock-pit-v2-1-${{ runner.os }}-schema1-

      - name: Verify checkpoint files exist before market downloads
        shell: bash
        run: |
          echo "CACHE_MATCHED_KEY=${{ steps.restore.outputs.cache-matched-key }}"
          python - <<'PYCODE'
          import os
          from pathlib import Path
          p = Path(os.environ["PIT_CACHE_DIR"])
          names = ["annual_rows.csv.gz", "pair_status.json", "valuation_map.json", "valuation_status.json", "cache_meta.json"]
          missing = [n for n in names if not (p/n).is_file()]
          if missing:
              raise SystemExit("Complete V2.1 checkpoint not restored: " + repr(missing) + ". This controlled repair refuses to restart a multi-hour BaoStock download.")
          print((p/"cache_meta.json").read_text())
          PYCODE

      - name: Restore exact bank snapshot from audited V2.1.1 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${BASELINE_ARTIFACT_DIR}"
          # Optional permanent backup supplied in the release ZIP.
          if [ -f "reference_inputs/v211/bank_f10_v2.csv.gz" ]; then
            cp "reference_inputs/v211/bank_f10_v2.csv.gz" "${BASELINE_ARTIFACT_DIR}/bank_f10_v2.csv.gz"
          else
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 180               -H "Authorization: Bearer ${GH_TOKEN}"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10302031941/zip"               -o _v211_frozen.zip
            echo "80903fc603deeb3c37f98179214b5a54aab39ff196c3ed3ce25c3aab61383216  _v211_frozen.zip" | sha256sum -c -
            python - <<'PYCODE'
          import os, zipfile
          from pathlib import Path
          with zipfile.ZipFile("_v211_frozen.zip") as z:
              matches = [n for n in z.namelist() if n.endswith("/bank_f10_v2.csv.gz")]
              if len(matches) != 1:
                  raise SystemExit("Baseline bank file missing/ambiguous")
              (Path(os.environ["BASELINE_ARTIFACT_DIR"])/"bank_f10_v2.csv.gz").write_bytes(z.read(matches[0]))
          PYCODE
          fi
          echo "8a14185923f4579807e75f33093989575deecf3f1173286e269f7a4f6eaa755d  ${BASELINE_ARTIFACT_DIR}/bank_f10_v2.csv.gz" | sha256sum -c -

      - name: Run V2.2 controlled repair
        timeout-minutes: 40
        shell: bash
        run: |
          python scripts/research/dividend_pit_top10_v2_2.py 2>&1 | tee "${OUT_DIR}/reports/run.log"

      - name: Show results and independent reconciliation
        if: always()
        shell: bash
        run: |
          for name in engineering_gates.json research_gates.json fatal_error.json; do
            if [ -f "${OUT_DIR}/reports/${name}" ]; then cat "${OUT_DIR}/reports/${name}"; fi
          done
          if [ -f "${OUT_DIR}/reports/return_reconciliation.csv" ]; then cat "${OUT_DIR}/reports/return_reconciliation.csv"; fi
          if [ -f "${OUT_DIR}/out/README.md" ]; then cat "${OUT_DIR}/out/README.md"; fi

      - name: Preserve verified checkpoint under a fresh cache key
        if: ${{ always() && hashFiles('_persistent_cache/baostock_early_v2_1/cache_meta.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PIT_CACHE_DIR }}
          key: baostock-pit-v2-1-${{ runner.os }}-schema1-v22-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload complete audit, code and checkpoint backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dividend-pit-top10-v2-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OUT_DIR }}/out/
            ${{ env.OUT_DIR }}/reports/
            ${{ env.PIT_CACHE_DIR }}/
            scripts/research/dividend_pit_top10_v1.py
            scripts/research/dividend_pit_top10_v2.py
            scripts/research/dividend_pit_top10_v2_1.py
            scripts/research/dividend_pit_top10_v2_2.py
          if-no-files-found: warn
          retention-days: 30
          compression-level: 1
