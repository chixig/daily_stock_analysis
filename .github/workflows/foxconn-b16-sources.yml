name: Foxconn B16 Payment Evidence
on:
  push:
    branches: [research/foxconn-t0-20260922-b16]
    paths:
      - scripts/research/foxconn_b16_sources.py
      - .github/workflows/foxconn-b16-sources.yml
permissions:
  contents: write
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas==2.2.3 requests==2.32.3 tabulate==0.9.0 pypdf==5.3.0 beautifulsoup4==4.13.3
      - run: python scripts/research/foxconn_b16_sources.py
      - name: Preserve B16 evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/foxconn_t0_20260922_b16/
          git diff --cached --quiet || git commit -m "research(B16): preserve dividend source inspection"
          git push origin HEAD:research/foxconn-t0-20260922-b16
