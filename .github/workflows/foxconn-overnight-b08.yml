name: Foxconn B08 Overnight Research
on:
  push:
    branches: [research/foxconn-overnight-20260916-b08]
    paths:
      - scripts/research/foxconn_overnight_b08.py
      - .github/workflows/foxconn-overnight-b08.yml
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas==2.2.3 numpy==2.1.3 tabulate==0.9.0
      - run: python -m py_compile scripts/research/foxconn_overnight_b08.py
      - run: python scripts/research/foxconn_overnight_b08.py
      - uses: actions/upload-artifact@v4
        with:
          name: foxconn-b08-${{ github.run_id }}
          path: research/foxconn_overnight_20260916_b08/
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/foxconn_overnight_20260916_b08/
          git commit -m "research: preserve overnight evidence"
          git push origin HEAD:research/foxconn-overnight-20260916-b08
