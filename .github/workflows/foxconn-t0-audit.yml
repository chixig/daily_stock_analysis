name: Foxconn T0 Audited Research
on:
  push:
    branches: [research/foxconn-t0-20260913]
    paths:
      - scripts/research/foxconn_t0_audit.py
      - .github/workflows/foxconn-t0-audit.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: foxconn-t0-audit
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fixed research dependencies
        run: pip install pandas==2.2.3 numpy==2.1.3 tabulate==0.9.0 baostock==0.9.3
      - name: Deterministic checks
        run: python scripts/research/foxconn_t0_audit.py --test
      - name: Audit and bounded research
        run: python scripts/research/foxconn_t0_audit.py
      - name: Preserve full evidence on GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foxconn-t0-audit-${{ github.run_id }}
          path: research/foxconn_t0_20260913/
          retention-days: 90
      - name: Persist successful research in this isolated branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/foxconn_t0_20260913/
          if ! git diff --cached --quiet; then
            git commit -m "research: preserve audited foxconn T0 evidence"
            git push origin HEAD:research/foxconn-t0-20260913
          fi
