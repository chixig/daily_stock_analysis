name: Foxconn B22 submitted report verification
on:
  push:
    branches: [research/foxconn-t0-20261002-b22]
    paths: [scripts/research/foxconn_b22_delivery.py, research/foxconn_t0_20261002_b22/REPORT.md, research/foxconn_t0_20261002_b22/report_checks.json, .github/workflows/foxconn-b22-delivery.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: foxconn-b22
  cancel-in-progress: false
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==2.1.3 tabulate==0.9.0 requests==2.32.3
      - name: Verify protected research and submitted report
        run: |
          set -euo pipefail
          python -u scripts/research/foxconn_b22_delivery.py 2>&1 | tee research/foxconn_t0_20261002_b22/delivery.log
      - name: Preserve final verification
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f research/foxconn_t0_20261002_b22/
          if ! git diff --cached --quiet; then
            git commit -m 'Verify submitted B22 report and protected research'
            git push origin HEAD:research/foxconn-t0-20261002-b22
          fi
