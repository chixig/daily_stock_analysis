name: Foxconn B22 saved result details
on:
  push:
    branches: [research/foxconn-t0-20261002-b22]
    paths: [scripts/research/foxconn_b22_details.py, .github/workflows/foxconn-b22-details.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: foxconn-b22
  cancel-in-progress: false
jobs:
  details:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==2.1.3 tabulate==0.9.0 requests==2.32.3
      - name: Produce bounded saved-result tables
        run: |
          set -euo pipefail
          git fetch --depth=1 origin a8e9335b4157908668df8bb4b1411c4e68c13b7d
          python -u scripts/research/foxconn_b22_details.py 2>&1 | tee research/foxconn_t0_20261002_b22/details.log
      - name: Preserve evidence
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f research/foxconn_t0_20261002_b22/
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve B22 bounded decision and precision evidence'
            git push origin HEAD:research/foxconn-t0-20261002-b22
          fi
