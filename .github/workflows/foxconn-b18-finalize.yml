name: Foxconn B18 Final Report and Reconciliation
on:
  push:
    branches: [research/foxconn-t0-20260926-b18]
    paths:
      - scripts/research/foxconn_b18_finalize.py
      - .github/workflows/foxconn-b18-finalize.yml
permissions:
  contents: write
jobs:
  verify-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas==2.2.3 numpy==2.1.3 tabulate==0.9.0 requests==2.32.3
      - run: python -m py_compile scripts/research/foxconn_b18_finalize.py
      - run: python scripts/research/foxconn_b18_finalize.py
      - name: Preserve final report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/foxconn_t0_20260926_b18/REPORT.md research/foxconn_t0_20260926_b18/reader_* research/foxconn_t0_20260926_b18/delivery_* research/foxconn_t0_20260926_b18/final_posthoc_independent_checks.csv
          git diff --cached --quiet || git commit -m "research(B18): preserve final report and reconciliation"
          git push origin HEAD:research/foxconn-t0-20260926-b18
