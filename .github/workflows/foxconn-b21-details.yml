name: Foxconn B21 decision details
on:
  push:
    branches: [research/foxconn-t0-20261002-b21]
    paths: [scripts/research/foxconn_b21_details.py, .github/workflows/foxconn-b21-details.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: foxconn-b21
  cancel-in-progress: false
jobs:
  details:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==2.1.3 tabulate==0.9.0 requests==2.32.3
      - name: Summarize frozen results
        run: |
          set -euo pipefail
          python -u scripts/research/foxconn_b21_details.py 2>&1 | tee research/foxconn_t0_20261002_b21/details.log
      - name: Preserve evidence
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f research/foxconn_t0_20261002_b21/
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve B21 decision details without changing accounts'
            git push origin HEAD:research/foxconn-t0-20261002-b21
          fi
