name: Foxconn B20 delivery verification
on:
  push:
    branches: [research/foxconn-t0-20261002-b20]
    paths: [scripts/research/foxconn_b20_deliver.py, research/foxconn_t0_20261002_b20/REPORT.md]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==2.1.3 tabulate==0.9.0 requests==2.32.3
      - run: |
          set -euo pipefail
          python -m py_compile scripts/research/foxconn_b20_deliver.py
          python scripts/research/foxconn_b20_deliver.py 2>&1 | tee research/foxconn_t0_20261002_b20/delivery.log
      - name: Preserve delivery verification
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f research/foxconn_t0_20261002_b20/
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve B20 final delivery verification and hashes'
            git push origin HEAD:research/foxconn-t0-20261002-b20
          fi
