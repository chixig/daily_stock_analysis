name: Foxconn B16 Bounded Accounts
on:
  push:
    branches: [research/foxconn-t0-20260922-b16]
    paths:
      - scripts/research/foxconn_b16_accounts.py
      - .github/workflows/foxconn-b16-accounts.yml
permissions:
  contents: write
jobs:
  revision:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas==2.2.3 numpy==2.1.3 tabulate==0.9.0 requests==2.32.3
      - run: python -m py_compile scripts/research/foxconn_b16_accounts.py
      - run: python scripts/research/foxconn_b16_accounts.py 2>&1 | tee research/foxconn_t0_20260922_b16/calculation.log
      - name: Preserve R1 evidence only
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/foxconn_t0_20260922_b16/
          git diff --cached --quiet || git commit -m "research(B16): preserve bounded account evidence"
          git push origin HEAD:research/foxconn-t0-20260922-b16
