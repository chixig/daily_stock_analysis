name: Foxconn source provenance and manual comparison preparation
on:
  push:
    branches: [research/foxconn-kline-20261005]
    paths: [scripts/research/foxconn_kline_provenance_r3.py, .github/workflows/foxconn-provenance-r3.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==2.1.3 requests==2.32.3
      - run: python -u scripts/research/foxconn_kline_provenance_r3.py
      - name: Preserve provenance
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f research/foxconn_kline_repair_20261005/provenance_r3/
          if ! git diff --cached --quiet; then
            git commit -m 'Trace conflicting minute versions and prepare THS comparison'
            git push origin HEAD:research/foxconn-kline-20261005
          fi
