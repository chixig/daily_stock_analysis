name: Foxconn B04 Swing and Causal Detection
on:
  push:
    branches: [research/foxconn-t0-20260913-b04]
    paths:
      - scripts/research/foxconn_t0_b04.py
      - .github/workflows/foxconn-t0-b04.yml
permissions:
  contents: write
concurrency:
  group: foxconn-b04-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas==2.2.3 numpy==2.1.3 tabulate==0.9.0
      - name: Compile changed research script
        run: python -m py_compile scripts/research/foxconn_t0_b04.py
      - name: Validate and calculate fixed study
        run: python scripts/research/foxconn_t0_b04.py
      - uses: actions/upload-artifact@v4
        with:
          name: foxconn-b04-${{ github.run_id }}
          path: research/foxconn_t0_20260913_b04/
      - name: Preserve evidence on research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/foxconn_t0_20260913_b04/
          git commit -m "research: preserve swing and causal detection evidence"
          git push origin HEAD:research/foxconn-t0-20260913-b04
