name: Foxconn B14 Historical Transactions Research
on:
  push:
    branches: [research/foxconn-overnight-20260917-b14]
    paths:
      - scripts/research/foxconn_overnight_b14.py
      - .github/workflows/foxconn-overnight-b14.yml
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas==2.2.3 numpy==2.1.3 tabulate==0.9.0 scipy==1.14.1 scikit-learn==1.5.2 baostock==0.8.9 pytdxdata==0.3.2
      - run: python -m py_compile scripts/research/foxconn_overnight_b14.py
      - run: python scripts/research/foxconn_overnight_b14.py
      - uses: actions/upload-artifact@v4
        with:
          name: foxconn-b14-${{ github.run_id }}
          path: research/foxconn_overnight_20260917_b14/
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/foxconn_overnight_20260917_b14/
          git commit -m "research: preserve overnight evidence"
          git push origin HEAD:research/foxconn-overnight-20260917-b14
