name: Foxconn B19 research
on:
  push:
    branches: [research/foxconn-t0-20260928-b19]
    paths: [scripts/research/foxconn_b19.py, .github/workflows/foxconn-b19.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==2.1.3 tabulate==0.9.0 requests==2.32.3
      - name: Run bounded optimization
        run: |
          mkdir -p research/foxconn_t0_20260928_b19
          python -m py_compile scripts/research/foxconn_b19.py
          python -u scripts/research/foxconn_b19.py 2>&1 | tee research/foxconn_t0_20260928_b19/calculation.log
      - name: Preserve research evidence
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f research/foxconn_t0_20260928_b19/
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve B19 bounded optimization evidence'
            git push origin HEAD:research/foxconn-t0-20260928-b19
          fi
